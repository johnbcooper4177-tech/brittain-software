<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">BAi logo</title>
  <desc id="desc">Brittain-Ai BAi logo mark.</desc>
  <defs>
    <linearGradient id="bai-bg" x1="130" y1="116" x2="900" y2="918" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06474b"/>
      <stop offset="0.54" stop-color="#007f82"/>
      <stop offset="1" stop-color="#0a2e31"/>
    </linearGradient>
    <radialGradient id="bai-sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(282 225) rotate(48) scale(410)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="42" stdDeviation="44" flood-color="#06474b" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="54" y="54" width="916" height="916" rx="156" fill="url(#bai-bg)" filter="url(#soft-shadow)"/>
  <rect x="54" y="54" width="916" height="916" rx="156" fill="url(#bai-sheen)"/>
  <rect x="72" y="72" width="880" height="880" rx="140" fill="none" stroke="#ffffff" stroke-opacity="0.58" stroke-width="22"/>
  <rect x="97" y="97" width="830" height="830" rx="118" fill="none" stroke="#d8b35b" stroke-opacity="0.18" stroke-width="4"/>
  <text
    x="512"
    y="594"
    fill="#ffffff"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="262"
    font-weight="900"
