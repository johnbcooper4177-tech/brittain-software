name: Site validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/validate_site.py
      - run: git diff --check
